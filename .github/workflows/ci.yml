name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The real daily prompt bank is private; CI builds and tests with the sample bank.
      - run: cp src/server/data/editions.sample.json src/server/data/editions.json
      # Types, lint, unit + API tests, build and the 1.5 MB gzipped bundle budget.
      - run: npm run check
        env:
          KARMASS_SAMPLE_BANK: '1'
